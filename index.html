<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <meta property="og:title" content="שינוע מבחנות מח עצם" />
  <meta property="og:description" content="יוצרים הודעת גיוס לשינוע מבחנות מח עצם עם ידידים: בוחרים מקור ויעד ומשתפים בוואטסאפ." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand: #0E4A5E;
      --brand-deep: #0A3848;
      --brand-tint: #DFEDF1;
      --ice: #EFF2F1;
      --ice-deep: #E1E6E4;
      --white: #ffffff;
      --ink: #13222B;
      --ink-soft: #4C5A62;
      --edge: #8C9391;
      --hairline: #CDD3D1;
      --send: #0B6B57;
      --send-deep: #08564A;
      --danger: #A61B1B;
      --radius: 4px;
      --serif: 'Frank Ruhl Libre', 'David Libre', Georgia, serif;
      --sans: 'IBM Plex Sans Hebrew', 'Segoe UI', Arial, sans-serif;
      --rail-gutter: 32px;
      --field-h: 56px;
      --label-h: 29px;
    }

    html {
      scroll-behavior: smooth;
      background: var(--brand);
    }

    body {
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--brand);
      direction: rtl;
    }

    ::selection {
      background: var(--brand);
      color: var(--white);
    }

    input { caret-color: var(--brand); }

    h1, h2 { text-wrap: balance; }

    :focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .page-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ─── HERO ─── */
    /* The title sits behind the image and only shows if the image fails to load */
    .hero {
      display: grid;
      background: var(--brand);
    }

    .hero > * { grid-area: 1 / 1; }

    .header-title {
      align-self: start;
      padding: 32px 24px;
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 900;
      line-height: 1.15;
      color: var(--ice);
    }

    .header-banner {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
    }

    /* ─── SHEET ─── */
    .sheet {
      flex: 1;
      background: var(--ice);
      padding: 36px 24px 28px;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 26px;
    }

    /* ─── FIELDS ─── */
    .field-group {
      position: relative;
      margin-bottom: 22px;
      padding-inline-start: var(--rail-gutter);
    }

    label {
      display: block;
      min-height: var(--label-h);
      font-size: 15px;
      font-weight: 600;
    }

    /* The route: one line from origin to destination */
    .route { position: relative; }

    .route::before {
      content: '';
      position: absolute;
      inset-inline-start: 8px;
      width: 2px;
      top: calc(var(--label-h) + var(--field-h) / 2);
      bottom: calc(var(--field-h) / 2);
      background: var(--brand);
    }

    .route .field-group::before {
      content: '';
      position: absolute;
      inset-inline-start: 0;
      top: calc(var(--label-h) + var(--field-h) / 2 - 9px);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--brand);
      background: var(--ice);
    }

    .route .field-group:last-child::before {
      background: var(--brand);
    }

    input[type="text"],
    input[type="tel"],
    input[type="url"] {
      width: 100%;
      height: var(--field-h);
      padding: 0 16px;
      border: 1.5px solid var(--edge);
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 500;
      direction: rtl;
      color: var(--ink);
      background: var(--white);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      -webkit-appearance: none;
    }

    /* Web addresses read left to right, whatever the page direction */
    input[type="url"] {
      direction: ltr;
      text-align: right;
    }

    input[type="url"]:not(:placeholder-shown) { text-align: left; }

    input[type="tel"] {
      direction: ltr;
      text-align: right;
    }

    input[type="text"]::placeholder,
    input[type="tel"]::placeholder,
    input[type="url"]::placeholder {
      color: var(--ink-soft);
      font-weight: 400;
    }

    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="url"]:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(14,74,94,0.25);
    }

    /* ─── PLACE COMBOBOX ─── */
    .combo {
      position: relative;
      scroll-margin-top: 44px;
    }

    .combo input[type="text"] {
      padding-inline-end: 42px;
    }

    .combo::after {
      content: '';
      position: absolute;
      top: calc(var(--field-h) / 2 - 7px);
      inset-inline-end: 18px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--ink-soft);
      border-bottom: 2px solid var(--ink-soft);
      transform: rotate(45deg);
      transition: transform 0.18s;
      pointer-events: none;
    }

    .combo.is-open::after {
      transform: translateY(4px) rotate(-135deg);
    }

    .combo-list {
      position: absolute;
      top: calc(100% + 4px);
      inset-inline: 0;
      z-index: 10;
      max-height: 264px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--edge) transparent;
      padding: 4px;
      list-style: none;
      background: var(--white);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: 0 14px 32px rgba(10,40,52,0.22);
    }

    .combo-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 12px;
      border-radius: 2px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    @media (hover: hover) {
      .combo-option:hover { background: var(--ice); }
    }

    .combo-option.is-active { background: var(--brand-tint); }

    .combo-option[aria-selected="true"] {
      font-weight: 700;
      color: var(--brand);
    }

    .combo-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .combo-saved {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .combo-delete {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      margin-inline-end: -10px;
      border: none;
      border-radius: var(--radius);
      background: none;
      font-family: inherit;
      font-size: 20px;
      line-height: 1;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .combo-delete:hover {
      background: var(--brand-tint);
      color: var(--danger);
    }

    .combo-add {
      position: sticky;
      bottom: -4px;
      display: block;
      margin: 4px -4px -4px;
      padding: 10px 16px;
      border-radius: 0;
      border-top: 1.5px solid var(--hairline);
      background: var(--white);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .combo-add:only-child {
      margin-top: -4px;
      border-top: none;
    }

    .combo-add.is-active { background: var(--brand-tint); }

    @media (hover: hover) {
      .combo-add:hover:not(.is-active) { background: var(--ice); }
    }

    .combo-add-hint {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    /* Room to lift the open list above the on-screen keyboard */
    @media (pointer: coarse) {
      .combo-list { max-height: 220px; }
      body:has(.combo.is-open) .sheet { padding-bottom: 70vh; }
    }

    /* ─── CONTACT PICKER ─── */
    .contact {
      border: none;
      min-width: 0;
      margin-bottom: 22px;
      padding-inline-start: var(--rail-gutter);
    }

    .contact legend {
      padding: 0;
      min-height: var(--label-h);
      font-size: 15px;
      font-weight: 600;
    }

    .contact-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .contact-option {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: var(--field-h);
      margin: 0;
      padding: 6px 4px;
      border: 1.5px solid var(--edge);
      border-radius: var(--radius);
      background: var(--white);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .contact-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .contact-detail {
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Phone numbers need the full width on narrow phones */
    @media (max-width: 419px) {
      .contact { padding-inline-start: 0; }
    }

    @media (max-width: 349px) {
      .contact-options { grid-template-columns: minmax(0, 1fr); }
    }

    @media (hover: hover) {
      .contact-option:hover { background: var(--ice-deep); }
    }

    .contact-option:has(input:checked) {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
      background: var(--brand-tint);
      color: var(--brand);
    }

    .contact-option:has(input:checked) .contact-detail { color: var(--ink); }

    .contact-option:has(input:focus-visible) {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .contact-custom {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-top: 14px;
    }

    .contact-custom[hidden] { display: none; }

    /* ─── BUTTONS ─── */
    .btn-generate,
    .btn-generate-image,
    .btn-whatsapp,
    .btn-copy,
    .btn-save-image {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 12px 16px;
      border: 1.5px solid transparent;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, transform 0.1s;
      -webkit-appearance: none;
    }

    .btn-generate:active,
    .btn-generate-image:active,
    .btn-whatsapp:active,
    .btn-copy:active,
    .btn-save-image:active { transform: translateY(1px); }

    .btn-generate {
      margin-top: 30px;
      background: var(--brand);
      color: var(--white);
    }

    .btn-generate:hover { background: var(--brand-deep); }

    .btn-generate-image {
      margin-top: 10px;
      background: transparent;
      border-color: var(--brand);
      color: var(--brand);
    }

    .btn-generate-image:hover { background: var(--brand-tint); }

    .btn-generate-image:disabled {
      cursor: wait;
      opacity: 0.6;
      transform: none;
    }

    .form-error {
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--danger);
      text-wrap: balance;
    }

    .form-error[hidden],
    .message-box[hidden],
    .image-preview[hidden],
    .btn-save-image[hidden] { display: none; }

    .btn-whatsapp {
      background: var(--send);
      color: var(--white);
    }

    .btn-whatsapp:hover { background: var(--send-deep); }

    .btn-copy,
    .btn-save-image {
      background: transparent;
      border-color: var(--ink);
      color: var(--ink);
    }

    .btn-copy:hover,
    .btn-save-image:hover { background: var(--ice-deep); }

    .btn-copy.copied {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--white);
    }

    .btn-wa-text {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-soft);
      text-underline-offset: 3px;
    }

    .btn-wa-text:hover { color: var(--ink); }

    /* ─── RESULT ─── */
    .result-card {
      display: none;
      margin-top: 36px;
      padding-top: 32px;
      border-top: 2px solid var(--ink);
      scroll-margin-top: 12px;
      animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card.visible {
      display: block;
    }

    .result-label {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .message-box {
      background: var(--white);
      border-radius: var(--radius);
      padding: 18px 18px 20px;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      direction: rtl;
    }

    .image-preview {
      display: block;
      width: 100%;
      height: auto;
      border-radius: var(--radius);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    /* ─── FOOTER ─── */
    footer {
      margin-top: 40px;
    }

    .footer-text {
      font-size: 14px;
      color: var(--ink-soft);
    }

    /* ─── WIDE SCREENS: image pane beside the form ─── */
    @media (min-width: 900px) {
      .page-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      }

      .hero {
        position: sticky;
        top: 0;
        height: 100dvh;
        align-content: end;
      }

      .sheet {
        padding: 72px 56px 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .result-card { animation: none; }
      .combo::after,
      input[type="text"],
      input[type="tel"],
      input[type="url"],
      .contact-option,
      .btn-generate,
      .btn-generate-image,
      .btn-whatsapp,
      .btn-copy,
      .btn-save-image { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">

    <!-- HERO -->
    <header class="hero">
      <h1 class="header-title">שינוע מבחנות מח עצם</h1>
      <img
        id="headerBanner"
        src="image.jpeg"
        alt="כל המציל נפש אחת מישראל כאילו קיים עולם מלא"
        class="header-banner"
        width="1600"
        height="1067"
        onerror="this.style.display='none'"
      />
    </header>

    <main class="sheet">
      <div class="container">

        <!-- FORM -->
        <section>
          <h2 class="card-title">יצירת הודעת גיוס</h2>

          <div class="route">
            <div class="field-group">
              <label for="origin">נקודת מקור</label>
              <div class="combo">
                <input type="text" id="origin" placeholder="חיפוש עיר, מושב או קיבוץ" />
              </div>
            </div>

            <div class="field-group">
              <label for="destination">נקודת יעד</label>
              <div class="combo">
                <input type="text" id="destination" placeholder="חיפוש עיר, מושב או קיבוץ" />
              </div>
            </div>
          </div>

          <div class="field-group">
            <label for="link">קישור לאירוע</label>
            <input type="url" id="link" placeholder="https://yedidim.startach.io/..." />
          </div>

          <fieldset class="contact">
            <legend>איש קשר בהודעה</legend>
            <div class="contact-options">
              <label class="contact-option">
                <input type="radio" name="contact" value="yaakov" checked />
                יעקב כהן
                <span class="contact-detail" dir="ltr">050-202-6907</span>
              </label>
              <label class="contact-option">
                <input type="radio" name="contact" value="sruli" />
                שרוליק כץ
                <span class="contact-detail" dir="ltr">058-368-7905</span>
              </label>
              <label class="contact-option">
                <input type="radio" name="contact" value="custom" />
                אחר
                <span class="contact-detail">שם ומספר</span>
              </label>
            </div>
            <div class="contact-custom" id="contactCustom" hidden>
              <div>
                <label for="contactName">שם</label>
                <input type="text" id="contactName" autocomplete="name" />
              </div>
              <div>
                <label for="contactPhone">טלפון</label>
                <input type="tel" id="contactPhone" autocomplete="tel" placeholder="050-000-0000" />
              </div>
            </div>
          </fieldset>

          <button class="btn-generate" onclick="generateMessage()">צור הודעה עכשיו</button>
          <button class="btn-generate-image" id="imageBtn" onclick="generateImage()">צור תמונה עכשיו</button>
          <p class="form-error" id="imageError" role="alert" hidden></p>
        </section>

        <!-- RESULT -->
        <section class="result-card" id="resultCard">
          <h2 class="result-label" id="resultLabel">ההודעה מוכנה לשיתוף</h2>
          <div class="message-box" id="messageBox"></div>
          <img class="image-preview" id="imagePreview" alt="תמונת הודעת הגיוס" hidden />
          <div class="actions">
            <button class="btn-copy" id="copyBtn" onclick="copyMessage()">📋 &nbsp;העתק הודעה</button>
            <button class="btn-whatsapp" id="whatsappShareBtn" onclick="shareWithImage()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
              שתף עם תמונה בוואטסאפ
            </button>
            <a class="btn-save-image" id="saveImageLink" download="bone-marrow.jpg" hidden>שמור תמונה</a>
            <!-- Fallback plain WhatsApp link (text only) -->
            <a class="btn-wa-text" id="waTextLink" href="#" target="_blank">
              שתף טקסט בלבד (ללא תמונה)
            </a>
          </div>
        </section>

        <footer>
          <p class="footer-text">מדובר בהצלת חיים</p>
        </footer>

      </div>
    </main>

  </div>

  <script src="israel-localities.js"></script>
  <script>
    let generatedMessage = '';
    let generatedLink = '';
    let generatedContactLine = '';
    let generatedImageFile = null;
    let imagePreviewUrl = '';
    let imageRequestId = 0;

    const E = {
      tube:  '\uD83E\uDDEA',
      phone: '\uD83D\uDCF2',
      world: '\uD83C\uDF0F',
      heart: '\uD83E\uDDE1',
      clip:  '\uD83D\uDCCB',
      check: '\u2705',
    };

    const CONTACTS = {
      yaakov: { name: 'יעקב כהן', phone: '050-202-6907' },
      sruli:  { name: 'שרוליק כץ', phone: '058-368-7905' },
    };

    // Israeli numbers need the country code: 050-123-4567 becomes 972501234567
    function whatsAppLink(phone) {
      const digits = phone.replace(/\D/g, '');
      const number = digits.startsWith('972') ? '972' + digits.slice(3).replace(/^0/, '')
        : digits.startsWith('0') ? '972' + digits.slice(1)
        : /^5\d{8}$/.test(digits) ? '972' + digits
        : digits;
      return 'https://wa.me/' + number;
    }

    function getContact() {
      const choice = document.querySelector('input[name="contact"]:checked').value;
      if (choice !== 'custom') return CONTACTS[choice];

      const name  = document.getElementById('contactName').value.trim();
      const phone = document.getElementById('contactPhone').value.trim();
      if (!name) {
        shakeInvalid('contactName');
        return null;
      }
      if (phone.replace(/\D/g, '').length < 9) {
        shakeInvalid('contactPhone');
        return null;
      }
      return { name, phone };
    }

    const MESSAGE_TITLE = '🧪 *״מערך השינוע מבחנות מח עצם״* 🧪';

    function buildContactLine(contact) {
      return '*' + E.phone + ' מי שיכול לקדם לאיזור שיעלה מול ' + contact.name + ' בוואטסאפ:*\n' + whatsAppLink(contact.phone);
    }

    function buildMessage(origin, destination, link, contact) {
      return (
        MESSAGE_TITLE + '\n\n' +
        'סוג אירוע: שינוע / מבחנת מח עצם\n' +
        'מיקום: ' + origin + '\n' +
        (link ? link + '\n' : '') +
        '\n*' + E.tube + ' שינוע מבחנת מח עצם ל' + destination + ' ' + E.tube + '*\n\n' +
        buildContactLine(contact)
      );
    }

    // Keeps only the address when anything else was pasted along with it
    function cleanLink(raw) {
      const url = raw.match(/https?:\/\/\S+/);
      return url ? url[0] : raw.trim().split(/\s/)[0];
    }

    function prepareMessage() {
      const origin      = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const linkInput   = document.getElementById('link');
      const link        = cleanLink(linkInput.value);
      linkInput.value   = link;

      if (!origin || !destination) {
        shakeInvalid(!origin ? 'origin' : 'destination');
        return false;
      }

      const contact = getContact();
      if (!contact) return false;

      rememberPlace(origin);
      rememberPlace(destination);

      generatedMessage = buildMessage(origin, destination, link, contact);
      generatedLink = link;
      generatedContactLine = buildContactLine(contact);
      document.getElementById('messageBox').textContent = generatedMessage;

      const waText = encodeURIComponent(generatedMessage);
      document.getElementById('waTextLink').href = 'https://wa.me/?text=' + waText;

      document.getElementById('copyBtn').innerHTML = E.clip + ' \u00A0\u05D4\u05E2\u05EA\u05E7 \u05D4\u05D5\u05D3\u05E2\u05D4';
      document.getElementById('copyBtn').classList.remove('copied');
      return true;
    }

    function showResult(imageFile) {
      if (imagePreviewUrl) URL.revokeObjectURL(imagePreviewUrl);
      generatedImageFile = imageFile;
      imagePreviewUrl = imageFile ? URL.createObjectURL(imageFile) : '';

      const preview = document.getElementById('imagePreview');
      const saveLink = document.getElementById('saveImageLink');
      const copyBtn = document.getElementById('copyBtn');
      const shareBtn = document.getElementById('whatsappShareBtn');
      copyBtn.parentElement.prepend(...(imageFile ? [shareBtn, saveLink] : [copyBtn]));
      preview.hidden = saveLink.hidden = !imageFile;
      document.getElementById('messageBox').hidden = !!imageFile;
      if (imageFile) {
        preview.src = saveLink.href = imagePreviewUrl;
      } else {
        preview.removeAttribute('src');
        saveLink.removeAttribute('href');
      }
      document.getElementById('resultLabel').textContent = imageFile
        ? '\u05D4\u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D5\u05DB\u05E0\u05D4 \u05DC\u05E9\u05D9\u05EA\u05D5\u05E3'
        : '\u05D4\u05D4\u05D5\u05D3\u05E2\u05D4 \u05DE\u05D5\u05DB\u05E0\u05D4 \u05DC\u05E9\u05D9\u05EA\u05D5\u05E3';

      const resultCard = document.getElementById('resultCard');
      resultCard.classList.add('visible');
      resultCard.style.animation = 'none';
      requestAnimationFrame(() => {
        resultCard.style.animation = '';
        resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function generateMessage() {
      if (!prepareMessage()) return;
      imageRequestId++;
      document.getElementById('imageError').hidden = true;
      showResult(null);
    }

    async function generateImage() {
      if (!prepareMessage()) return;

      const requestId = ++imageRequestId;
      const btn = document.getElementById('imageBtn');
      const error = document.getElementById('imageError');
      error.hidden = true;
      btn.disabled = true;

      try {
        const file = await renderMessageImage();
        if (requestId === imageRequestId) showResult(file);
      } catch (e) {
        if (requestId === imageRequestId) {
          document.getElementById('resultCard').classList.remove('visible');
          error.textContent = '\u05D4\u05EA\u05DE\u05D5\u05E0\u05D4 \u05DC\u05D0 \u05E0\u05D5\u05E6\u05E8\u05D4. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1 \u05D0\u05D5 \u05DC\u05D9\u05E6\u05D5\u05E8 \u05D4\u05D5\u05D3\u05E2\u05EA \u05D8\u05E7\u05E1\u05D8.';
          error.hidden = false;
        }
      } finally {
        btn.disabled = false;
      }
    }

    function copyMessage() {
      if (!generatedMessage) return;
      const btn = document.getElementById('copyBtn');
      const doMark = () => {
        btn.innerHTML = E.check + ' \u00A0\u05D4\u05D5\u05E2\u05EA\u05E7 \u05D1\u05D4\u05E6\u05DC\u05D7\u05D4!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = E.clip + ' \u00A0\u05D4\u05E2\u05EA\u05E7 \u05D4\u05D5\u05D3\u05E2\u05D4';
          btn.classList.remove('copied');
        }, 2500);
      };
      navigator.clipboard.writeText(generatedMessage).then(doMark).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = generatedMessage;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;right:0;';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        doMark();
      });
    }

    async function renderMessageImage() {
      await document.fonts.ready;

      const imgBlob = await fetch('image.jpeg').then(r => { if (!r.ok) throw new Error(); return r.blob(); });
      const imgBitmap = await createImageBitmap(imgBlob);

      const W = 1080;
      const bannerH = Math.round(imgBitmap.height * (W / imgBitmap.width));
      const PAD = 64;
      const FS  = 42;
      const LH  = FS * 1.85;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = 100;
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.direction    = 'rtl';
      ctx.textAlign    = 'right';

      // Parse each source line → {text, bold}, then word-wrap
      // The title and contact go in the text sent with the image, never on the image
      const withoutContact = generatedMessage
        .replace(MESSAGE_TITLE + '\n\n', '')
        .replace('\n\n' + generatedContactLine, '');
      const imageText = generatedLink
        ? withoutContact.replace(generatedLink + '\n', '').replace('\n' + generatedLink, '')
        : withoutContact;

      const parsed = [];
      for (const rawLine of imageText.split('\n')) {
        const bold = /\*/.test(rawLine);
        const text = rawLine.replace(/\*/g, '');
        ctx.font = `${bold ? 800 : 500} ${FS}px 'IBM Plex Sans Hebrew', Arial, sans-serif`;

        if (!text.trim()) { parsed.push({ text: '', bold }); continue; }

        const words = text.split(' ');
        let cur = '';
        for (const w of words) {
          const test = cur ? cur + ' ' + w : w;
          if (ctx.measureText(test).width > W - PAD * 2 && cur) {
            parsed.push({ text: cur, bold });
            cur = w;
          } else {
            cur = test;
          }
        }
        if (cur) parsed.push({ text: cur, bold });
      }

      const textH = parsed.length * LH + PAD * 2;
      canvas.height = bannerH + textH;

      // ── Draw banner ──
      ctx.drawImage(imgBitmap, 0, 0, W, bannerH);

      // ── Text background ──
      ctx.fillStyle = '#EFF2F1';
      ctx.fillRect(0, bannerH, W, textH);

      // Accent bar
      ctx.fillStyle = '#0A3848';
      ctx.fillRect(0, bannerH, W, 6);

      // ── Draw text lines ──
      ctx.textBaseline = 'top';
      ctx.direction    = 'rtl';
      ctx.textAlign    = 'right';
      parsed.forEach(({ text, bold }, i) => {
        ctx.font      = `${bold ? 800 : 500} ${FS}px 'IBM Plex Sans Hebrew', Arial, sans-serif`;
        ctx.fillStyle = '#13222B';
        ctx.fillText(text, W - PAD, bannerH + 6 + PAD + i * LH);
      });

      const finalBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.93));
      return new File([finalBlob], 'bone-marrow.jpg', { type: 'image/jpeg' });
    }

    async function shareWithImage() {
      if (!generatedMessage) return;

      try {
        const file = generatedImageFile || await renderMessageImage();

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], text: [MESSAGE_TITLE, generatedLink, generatedContactLine].filter(Boolean).join('\n\n') });
          return;
        }
      } catch(e) {
        if (e.name === 'AbortError') return;
      }

      window.location.href = 'https://wa.me/?text=' + encodeURIComponent(generatedMessage);
    }

    function shakeInvalid(id) {
      const el = document.getElementById(id);
      el.style.borderColor = '#e74c3c';
      el.style.boxShadow = '0 0 0 4px rgba(231,76,60,0.12)';
      el.focus();
      setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 1800);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.target.closest('button, a')) generateMessage();
    });

    // ── Place search ──
    const CUSTOM_PLACES_KEY = 'bone-marrow:custom-places';

    const PLACE_ALIASES = {
      'תא': 'תל אביב - יפו',
      'בש': 'באר שבע',
      'פת': 'פתח תקווה',
      'רג': 'רמת גן',
      'בב': 'בני ברק',
      'ראשלצ': 'ראשון לציון',
      'קש': 'קרית שמונה',
      'קג': 'קרית גת',
    };

    // Ignores punctuation and the קרית/קריית spelling difference
    function normalizePlace(name) {
      return name
        .toLowerCase()
        .replace(/["'`׳״]/g, '')
        .replace(/[-־()]/g, ' ')
        .replace(/י+/g, 'י')
        .replace(/ו+/g, 'ו')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function loadCustomPlaces() {
      try {
        const saved = JSON.parse(localStorage.getItem(CUSTOM_PLACES_KEY));
        return Array.isArray(saved) ? saved.filter(name => typeof name === 'string' && normalizePlace(name)) : [];
      } catch (e) {
        return [];
      }
    }

    const toPlace = custom => name => ({ name, key: normalizePlace(name), custom });
    const builtInPlaces = ISRAEL_LOCALITIES.map(toPlace(false));
    let customPlaces = loadCustomPlaces();
    let places = [];

    function refreshPlaces() {
      places = customPlaces.map(toPlace(true)).concat(builtInPlaces);
    }
    refreshPlaces();

    function saveCustomPlaces(names) {
      customPlaces = names;
      refreshPlaces();
      try {
        localStorage.setItem(CUSTOM_PLACES_KEY, JSON.stringify(customPlaces));
      } catch (e) { /* storage unavailable: the name lasts until the page closes */ }
    }

    function findPlace(name) {
      const key = normalizePlace(name);
      return places.find(place => place.key === key);
    }

    function rememberPlace(name) {
      const trimmed = name.trim();
      if (!normalizePlace(trimmed) || findPlace(trimmed)) return;
      saveCustomPlaces([trimmed, ...customPlaces]);
    }

    function forgetPlace(name) {
      saveCustomPlaces(customPlaces.filter(saved => saved !== name));
    }

    function searchPlaces(query) {
      const q = normalizePlace(query);
      if (!q) return places;

      const alias = PLACE_ALIASES[q];
      const rank = place => {
        if (place.name === alias) return 0;
        if (place.key.startsWith(q)) return 1;
        if (place.key.includes(' ' + q)) return 2;
        return place.key.includes(q) ? 3 : -1;
      };

      return places
        .map(place => ({ place, score: rank(place) }))
        .filter(match => match.score >= 0)
        .sort((a, b) =>
          a.score - b.score ||
          b.place.custom - a.place.custom ||
          a.place.key.length - b.place.key.length ||
          a.place.key.localeCompare(b.place.key, 'he'))
        .map(match => match.place);
    }

    function setupPlaceCombo(input) {
      const combo = input.closest('.combo');
      const list = document.createElement('ul');
      const isCoarsePointer = window.matchMedia('(pointer: coarse)');
      let items = [];
      let activeIndex = -1;
      let currentQuery = '';

      list.className = 'combo-list';
      list.id = input.id + '-list';
      list.setAttribute('role', 'listbox');
      list.setAttribute('aria-label', 'יישובים');
      list.hidden = true;
      combo.appendChild(list);

      input.setAttribute('role', 'combobox');
      input.setAttribute('aria-autocomplete', 'list');
      input.setAttribute('aria-controls', list.id);
      input.setAttribute('aria-expanded', 'false');
      input.setAttribute('autocomplete', 'off');

      const isOpen = () => !list.hidden;

      function buildOption(item, index) {
        const option = document.createElement('li');
        option.id = input.id + '-option-' + index;
        option.className = 'combo-option';
        option.setAttribute('role', 'option');
        option.dataset.index = index;
        option.setAttribute('aria-selected', 'false');

        if (item.isNew) {
          option.classList.add('combo-add');
          const hint = document.createElement('span');
          hint.className = 'combo-add-hint';
          hint.textContent = 'יישמר במכשיר הזה';
          option.append('הוספת "' + item.name + '" לרשימה', hint);
          return option;
        }

        const name = document.createElement('span');
        name.className = 'combo-name';
        name.textContent = item.name;
        option.appendChild(name);
        option.setAttribute('aria-selected', String(item.key === normalizePlace(input.value)));

        if (item.custom) {
          const saved = document.createElement('span');
          saved.className = 'combo-saved';
          saved.textContent = 'נשמר';
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'combo-delete';
          remove.tabIndex = -1;
          remove.textContent = '×';
          remove.setAttribute('aria-label', 'מחיקת ' + item.name + ' מהרשימה');
          option.append(saved, remove);
        }
        return option;
      }

      function setActive(index) {
        list.children[activeIndex]?.classList.remove('is-active');
        activeIndex = index;
        const option = list.children[index];
        if (!option) {
          input.removeAttribute('aria-activedescendant');
          return;
        }
        option.classList.add('is-active');
        input.setAttribute('aria-activedescendant', option.id);

        const addRow = list.querySelector('.combo-add');
        const covered = addRow && addRow !== option ? addRow.offsetHeight : 0;
        const top = option.offsetTop;
        const bottom = top + option.offsetHeight;
        if (top < list.scrollTop) list.scrollTop = top;
        else if (bottom > list.scrollTop + list.clientHeight - covered) {
          list.scrollTop = bottom - list.clientHeight + covered;
        }
      }

      function render(query) {
        currentQuery = query;
        items = searchPlaces(query);
        const typed = query.trim();
        if (normalizePlace(typed) && !findPlace(typed)) {
          items = items.concat({ name: typed, isNew: true });
        }

        const fragment = document.createDocumentFragment();
        items.forEach((item, index) => fragment.appendChild(buildOption(item, index)));
        list.replaceChildren(fragment);
        list.scrollTop = 0;
        activeIndex = -1;
      }

      function open(query) {
        render(query);
        list.hidden = false;
        combo.classList.add('is-open');
        input.setAttribute('aria-expanded', 'true');
      }

      function close() {
        list.hidden = true;
        combo.classList.remove('is-open');
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        activeIndex = -1;
      }

      // Opens on the full list with the current value highlighted, like a native select
      function openFullList() {
        open('');
        const current = normalizePlace(input.value);
        setActive(current ? items.findIndex(item => item.key === current) : -1);
      }

      function choose(item) {
        if (item.isNew) rememberPlace(item.name);
        input.value = item.name;
        close();
      }

      function removeSaved(index) {
        forgetPlace(items[index].name);
        render(currentQuery);
        setActive(Math.min(index, items.length - 1));
      }

      input.addEventListener('focus', () => {
        openFullList();
        input.select();
        if (isCoarsePointer.matches) {
          // Lift the field above the on-screen keyboard once it has opened
          setTimeout(() => {
            if (document.activeElement === input) combo.scrollIntoView({ block: 'start' });
          }, 300);
        }
      });

      input.addEventListener('click', () => {
        if (!isOpen()) openFullList();
      });

      input.addEventListener('input', () => {
        open(input.value);
        setActive(normalizePlace(input.value) ? 0 : -1);
      });

      input.addEventListener('blur', close);

      input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (!isOpen()) { openFullList(); return; }
          if (!items.length) return;
          const step = e.key === 'ArrowDown' ? 1 : -1;
          const start = activeIndex < 0 && step < 0 ? 0 : activeIndex;
          setActive((start + step + items.length) % items.length);
        } else if (e.key === 'Enter' && isOpen()) {
          e.stopPropagation();
          if (activeIndex >= 0) {
            e.preventDefault();
            choose(items[activeIndex]);
          } else {
            close();
          }
        } else if (e.key === 'Escape' && isOpen()) {
          close();
        } else if (e.key === 'Delete' && items[activeIndex]?.custom && input.selectionStart === input.value.length) {
          e.preventDefault();
          removeSaved(activeIndex);
        }
      });

      // Keep focus in the input while tapping the list; a tap on a touch screen still scrolls it
      list.addEventListener('mousedown', e => e.preventDefault());

      list.addEventListener('click', e => {
        const option = e.target.closest('[role="option"]');
        if (!option) return;
        const index = Number(option.dataset.index);
        if (e.target.closest('.combo-delete')) {
          removeSaved(index);
          return;
        }
        choose(items[index]);
        if (isCoarsePointer.matches) input.blur();
      });
    }

    document.querySelectorAll('input[name="contact"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isCustom = radio.value === 'custom';
        document.getElementById('contactCustom').hidden = !isCustom;
        if (isCustom) document.getElementById('contactName').focus();
      });
    });

    setupPlaceCombo(document.getElementById('origin'));
    setupPlaceCombo(document.getElementById('destination'));
  </script>
</body>
